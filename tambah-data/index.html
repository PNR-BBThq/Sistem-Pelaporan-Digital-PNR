<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Borang PNR - GitHub Version</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding-bottom: 50px; }
    /* Tambahan Navbar untuk balik ke dashboard */
    .custom-nav { background: #198754; padding: 10px; margin-bottom: 20px; }
    .custom-nav a { color: white; text-decoration: none; font-weight: bold; }
    
    .container { max-width: 600px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
    .perosak-item { border: 1px solid #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 15px; background-color: #fff; position: relative; }
    .loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.9); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; visibility: hidden; }
    .preview-img { max-width: 80px; max-height: 80px; margin: 5px; border: 1px solid #ddd; object-fit: cover; }
    .btn-close-custom { position: absolute; top: 10px; right: 10px; }
  </style>
</head>
<body>

  <nav class="custom-nav text-center">
      <a href="../">⬅️ KEMBALI KE DASHBOARD</a>
  </nav>

  <div id="loader" class="loading-overlay">
      <div class="spinner-border text-success" role="status"></div>
      <p class="mt-2 fw-bold" id="loaderText">Memproses data...</p>
  </div>

  <div class="container">
    <div id="alertArea"></div> <h3 class="text-center text-success mb-4">🌱 Borang Pemantauan</h3>
    
    <form id="monitorForm" onsubmit="handleFormSubmit(event)">
      <h5 class="text-primary border-bottom pb-2">A. Maklumat Am</h5>
      <div class="mb-3"><label>Nama Pegawai</label><input type="text" class="form-control" name="namaPegawai" id="namaPegawai" required></div>
      <div class="mb-3"><label>Email</label><input type="email" class="form-control" name="email" id="email"></div>
      <div class="mb-3"><label>Tarikh Bancian</label><input type="date" class="form-control" name="tarikhBancian" id="tarikhBancian" required></div>
      
      <div class="row">
        <div class="col-6 mb-3">
            <label>Negeri</label>
            <select class="form-select" name="negeri" id="negeriSelect" onchange="updateDaerah()">
                <option value="">- Pilih -</option>
                <option value="Johor">Johor</option><option value="Kedah">Kedah</option><option value="Kelantan">Kelantan</option>
                <option value="Melaka">Melaka</option><option value="Negeri Sembilan">Negeri Sembilan</option><option value="Pahang">Pahang</option>
                <option value="Perak">Perak</option><option value="Perlis">Perlis</option><option value="Pulau Pinang">Pulau Pinang</option>
                <option value="Sabah">Sabah</option><option value="Sarawak">Sarawak</option><option value="Selangor">Selangor</option>
                <option value="Terengganu">Terengganu</option><option value="W.P. Kuala Lumpur">W.P. Kuala Lumpur</option>
                <option value="W.P. Labuan">W.P. Labuan</option><option value="W.P. Putrajaya">W.P. Putrajaya</option>
            </select>
        </div>
        <div class="col-6 mb-3">
            <label>Daerah</label>
            <select class="form-select" name="daerah" id="daerahSelect" required><option value="">- Pilih Negeri Dulu -</option></select>
        </div>
      </div>
      
      <div class="mb-3"><label>Nama Lokasi</label><input type="text" class="form-control" name="lokasi" id="lokasi" required></div>
      <div class="mb-3"><label>Koordinat GPS</label><div class="input-group"><input type="text" class="form-control" name="koordinat" id="gpsInput"><button type="button" class="btn btn-secondary" onclick="getLocation()">📍 Lokasi</button></div></div>

      <h5 class="text-primary border-bottom pb-2 mt-4">B. Maklumat Tanaman</h5>
      <div class="mb-3">
        <label>Kategori</label>
        <select class="form-select" name="kategori" id="kategoriSelect" onchange="updateTanamanList()" required>
            <option value="" disabled selected>- Loading Kategori... -</option>
        </select>
      </div>
      
      <div class="row">
          <div class="col-6 mb-3">
            <label>Nama Tanaman</label>
            <select class="form-select" name="namaTanaman" id="tanamanSelect" required onchange="updatePestDatalist()"><option value="">- Pilih Kategori Dulu -</option></select>
          </div>
          <div class="col-6 mb-3"><label>Varieti</label><input type="text" class="form-control" name="varieti" id="varieti"></div>
      </div>
      
      <div class="row">
          <div class="col-6 mb-3"><label>Umur</label><input type="text" class="form-control" name="umurTanaman" id="umurTanaman"></div>
          <div class="col-6 mb-3">
            <label>Luas (Ha)</label>
            <input type="number" step="0.001" class="form-control" name="luasBertanam" id="luasBertanamInput" required oninput="recalcAllPercent()">
          </div>
      </div>

      <h5 class="text-primary border-bottom pb-2 mt-4">C. Perosak & Penyakit</h5>
      <datalist id="existingPestList"></datalist>
      <div id="perosakList"></div>
      <button type="button" class="btn btn-sm btn-outline-primary w-100 mb-3" onclick="addPerosakField()">+ Tambah Perosak</button>
      
      <div class="mb-3">
        <label class="fw-bold">Syor Kawalan</label>
        <div id="syorCheckboxContainer" class="border p-2 rounded" style="max-height: 200px; overflow-y: auto;"></div>
        <textarea class="form-control mt-2" id="syorTambahan" rows="2" placeholder="Catatan tambahan..."></textarea>
      </div>

      <h5 class="text-primary border-bottom pb-2 mt-4">D. Gambar</h5>
      <div class="mb-3">
          <label class="form-label fw-bold">Tajuk Gambar</label>
          <input type="text" class="form-control" name="captionGambar" id="captionInput" oninput="limitCaption(this)">
          <div class="form-text text-muted" id="captionCount" style="font-size: 12px;">0/30 Huruf</div>
      </div>

      <div class="mb-3">
          <input type="file" class="form-control" id="imageInput" multiple onchange="previewImages()">
          <div id="imagePreviewContainer" class="d-flex flex-wrap mt-2"></div>
      </div>

      <button type="submit" class="btn btn-success w-100 mt-4 py-2 fw-bold" id="btnSubmit">HANTAR LAPORAN</button>
    </form>
  </div>

  <script>
    // --- 1. KONFIGURASI WEB APP URL ---
    const WEB_APP_URL = "https://script.google.com/a/macros/doa.gov.my/s/AKfycbwmlorXpSkvDx_PJT4eRYcWc0MGii7nyeafpSIDPdD-z_At1hY8leUzFyvAKy5kLrrA/exec";

    // --- 2. AMBIL PARAMETER URL (GANTI SCRIPTLETS) ---
    const urlParams = new URLSearchParams(window.location.search);
    let editBarisID = urlParams.get('baris'); 
    let editSebab = urlParams.get('sebab');

    const districtData = {"Johor": ["Batu Pahat", "Johor Bahru", "Kluang", "Kota Tinggi", "Kulai", "Mersing", "Muar", "Pontian", "Segamat", "Tangkak"], "Kedah": ["Baling", "Bandar Baharu", "Kota Setar", "Kuala Muda", "Kubang Pasu", "Kulim", "Langkawi", "Padang Terap", "Pendang", "Pokok Sena", "Sik", "Yan"], "Kelantan": ["Bachok", "Gua Musang", "Jeli", "Kota Bharu", "Kuala Krai", "Machang", "Pasir Mas", "Pasir Puteh", "Tanah Merah", "Tumpat"], "Melaka": ["Alor Gajah", "Jasin", "Melaka Tengah"], "Negeri Sembilan": ["Jelebu", "Jempol", "Kuala Pilah", "Port Dickson", "Rembau", "Seremban", "Tampin"], "Pahang": ["Bentong", "Bera", "Cameron Highlands", "Jerantut", "Kuantan", "Lipis", "Maran", "Pekan", "Raub", "Rompin", "Temerloh"], "Perak": ["Bagan Datuk", "Batang Padang", "Hilir Perak", "Hulu Perak", "Kampar", "Kerian", "Kinta", "Kuala Kangsar", "Larut, Matang dan Selama", "Manjung", "Muallim", "Perak Tengah"], "Perlis": ["Perlis"], "Pulau Pinang": ["Barat Daya", "Seberang Perai Selatan", "Seberang Perai Tengah", "Seberang Perai Utara", "Timur Laut"], "Sabah": ["Beaufort", "Beluran", "Kalabakan", "Keningau", "Kinabatangan", "Kota Belud", "Kota Kinabalu", "Kota Marudu", "Kuala Penyu", "Kudat", "Kunak", "Lahad Datu", "Nabawan", "Papar", "Penampang", "Pitas", "Putatan", "Ranau", "Sandakan", "Semporna", "Sipitang", "Tambunan", "Tawau", "Telupid", "Tenom", "Tongod", "Tuaran"], "Sarawak": ["Asajaya", "Bau", "Belaga", "Beluru", "Betong", "Bintulu", "Bukit Mabong", "Dalat", "Daro", "Julau", "Kabong", "Kanowit", "Kapit", "Kuching", "Lawas", "Limbang", "Lubok Antu", "Lundu", "Marudi", "Matu", "Meradong", "Miri", "Mukah", "Pakan", "Pusa", "Samarahan", "Saratok", "Sarikei", "Sebauh", "Selangau", "Serian", "Sibu", "Simunjan", "Song", "Sri Aman", "Subis", "Tanjung Manis", "Tatau", "Tebedu", "Telang Usan"], "Selangor": ["Gombak", "Hulu Langat", "Hulu Selangor", "Klang", "Kuala Langat", "Kuala Selangor", "Petaling", "Sabak Bernam", "Sepang"], "Terengganu": ["Besut", "Dungun", "Hulu Terengganu", "Kemaman", "Kuala Nerus", "Kuala Terengganu", "Marang", "Setiu"], "W.P. Kuala Lumpur": ["Kuala Lumpur"], "W.P. Labuan": ["Labuan"], "W.P. Putrajaya": ["Putrajaya"]};
    let fullPestTree = {}; 
    let filesToUpload = [];

    // --- 3. WINDOW ONLOAD ---
    window.onload = function() {
        if (editBarisID) {
            document.getElementById('alertArea').innerHTML = `<div class="alert alert-danger fw-bold">⚠️ PEMBETULAN DIPERLUKAN<br>Sebab: "${editSebab}"</div>`;
        }

        document.getElementById('loader').style.visibility = 'visible';
        
        // Fetch Reference Data (Kategori, Tanaman, Syor)
        fetch(`${WEB_APP_URL}?action=getReferences`)
            .then(res => res.json())
            .then(data => {
                fullPestTree = data.pestTree; 
                
                const kSelect = document.getElementById('kategoriSelect');
                kSelect.innerHTML = '<option value="">- Sila Pilih Kategori -</option>';
                Object.keys(fullPestTree).sort().forEach(kat => kSelect.add(new Option(kat, kat)));

                const sContainer = document.getElementById('syorCheckboxContainer');
                sContainer.innerHTML = "";
                data.syorList.forEach((s, i) => {
                    sContainer.innerHTML += `<div class="form-check"><input class="form-check-input syor-checkbox" type="checkbox" value="${s}" id="s${i}"><label class="form-check-label" for="s${i}">${s}</label></div>`;
                });

                if (editBarisID) {
                    loadDataForEdit(editBarisID);
                } else {
                    addPerosakField(); 
                    document.getElementById('loader').style.visibility = 'hidden';
                }
            });
    };

    // --- 4. FUNGSI LOAD DATA EDIT (GANTI google.script.run) ---
    function loadDataForEdit(id) {
        fetch(`${WEB_APP_URL}?action=getRowData&baris=${id}`)
            .then(res => res.json())
            .then(res => {
                document.getElementById('loader').style.visibility = 'hidden';
                if (res.error) { alert(res.error); return; }

                const setVal = (id, val) => { const el = document.getElementById(id); if(el) el.value = val; };

                setVal('namaPegawai', res.namaPegawai); 
                setVal('email', res.email); 
                setVal('tarikhBancian', res.tarikhBancian); 
                setVal('negeriSelect', res.negeri);
                
                updateDaerah(); 
                setTimeout(() => setVal('daerahSelect', res.daerah), 100);
                
                setVal('lokasi', res.lokasi); 
                setVal('gpsInput', res.koordinat);
                setVal('kategoriSelect', res.kategori); 
                
                updateTanamanList();
                setTimeout(() => {
                    setVal('tanamanSelect', res.namaTanaman); 
                    updatePestDatalist();
                }, 100);

                setVal('umurTanaman', res.umurTanaman); 
                setVal('varieti', res.varieti); 
                setVal('luasBertanamInput', res.luasBertanam);
                setVal('captionInput', res.captionGambar || ""); 

                if (res.syor) {
                    const arr = res.syor.split('; ');
                    document.querySelectorAll('.syor-checkbox').forEach(cb => { if (arr.includes(cb.value)) cb.checked = true; });
                }

                document.getElementById('perosakList').innerHTML = ""; 
                try {
                    const luas = JSON.parse(res.luasSerangan);
                    const pct = JSON.parse(res.peratusSerangan);
                    const sev = JSON.parse(res.keterukan);
                    const names = Object.keys(luas);
                    if(names.length > 0) {
                        names.forEach(n => {
                            addPerosakField();
                            const rows = document.querySelectorAll('.perosak-item');
                            const last = rows[rows.length-1];
                            last.querySelector('.perosak-name').value = n;
                            last.querySelector('.perosak-luas').value = luas[n];
                            last.querySelector('.perosak-percent').value = pct[n];
                            last.querySelector('.perosak-severity').value = sev[n];
                        });
                    } else { addPerosakField(); }
                } catch(e) { addPerosakField(); }
            });
    }

    // --- 5. LOGIK FORM (SAMA MACAM ASAL) ---
    function updateTanamanList() {
        const kat = document.getElementById('kategoriSelect').value;
        const tanSelect = document.getElementById('tanamanSelect');
        tanSelect.innerHTML = '<option value="">- Pilih Tanaman -</option>';
        if (kat && fullPestTree[kat]) {
            Object.keys(fullPestTree[kat]).sort().forEach(tan => tanSelect.add(new Option(tan, tan)));
            tanSelect.disabled = false;
        }
        updatePestDatalist(); 
    }

    function updatePestDatalist() {
        const kat = document.getElementById('kategoriSelect').value;
        const tan = document.getElementById('tanamanSelect').value;
        const dl = document.getElementById('existingPestList');
        dl.innerHTML = ""; 
        if(kat && tan && fullPestTree[kat][tan]) {
            fullPestTree[kat][tan].forEach(p => {
                const opt = document.createElement('option'); opt.value = p; dl.appendChild(opt);
            });
        }
    }

    function updateDaerah() { 
        const n = document.getElementById('negeriSelect').value; const d = document.getElementById('daerahSelect');
        d.innerHTML = "<option value=''>- Pilih -</option>";
        if(n && districtData[n]) districtData[n].forEach(x => d.add(new Option(x, x)));
    }

    function addPerosakField() {
        const div = document.createElement('div'); div.className = "perosak-item";
        div.innerHTML = `<button type="button" class="btn-close btn-close-custom" onclick="this.parentElement.remove()"></button><div class="mb-2"><label class="small fw-bold">Nama Perosak</label><input type="text" class="form-control perosak-name" list="existingPestList"></div><div class="row g-2"><div class="col-4"><label class="small">Luas(ha)</label><input type="number" step="0.001" class="form-control perosak-luas" oninput="calcPercent(this)"></div><div class="col-4"><label class="small">%</label><input type="text" class="form-control perosak-percent" readonly></div><div class="col-4"><label class="small">Tahap</label><select class="form-select perosak-severity"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div></div>`;
        document.getElementById('perosakList').appendChild(div);
    }

    function calcPercent(el) {
        const luasKebun = parseFloat(document.getElementById('luasBertanamInput').value) || 0;
        const luasSakit = parseFloat(el.value) || 0;
        const pctField = el.closest('.perosak-item').querySelector('.perosak-percent');
        pctField.value = (luasKebun > 0) ? ((luasSakit / luasKebun) * 100).toFixed(2) : 0;
    }

    function recalcAllPercent() { document.querySelectorAll('.perosak-luas').forEach(el => calcPercent(el)); }

    function getLocation() {
        if(navigator.geolocation) { navigator.geolocation.getCurrentPosition(p => { document.getElementById('gpsInput').value = p.coords.latitude.toFixed(5) + ", " + p.coords.longitude.toFixed(5); }, () => alert("Gagal dapat lokasi")); } else alert("Browser tak support GPS");
    }

    function previewImages() {
        const c = document.getElementById('imagePreviewContainer'); c.innerHTML = "";
        filesToUpload = Array.from(document.getElementById('imageInput').files);
        filesToUpload.forEach(f => {
            const r = new FileReader(); r.onload = e => { c.innerHTML += `<img src="${e.target.result}" class="preview-img">`; }; r.readAsDataURL(f);
        });
    }

    function limitCaption(el) {
        if (el.value.length > 30) el.value = el.value.substring(0, 30);
        document.getElementById('captionCount').innerText = el.value.length + "/30 Huruf";
    }

    // --- 6. SUBMIT DATA (FETCH POST) ---
    async function handleFormSubmit(e) {
        e.preventDefault();
        document.getElementById('loader').style.visibility = 'visible';
        document.getElementById('btnSubmit').disabled = true;

        const syors = Array.from(document.querySelectorAll('.syor-checkbox:checked')).map(c => c.value);
        const extra = document.getElementById('syorTambahan').value; if(extra) syors.push(extra);

        const luasS = {}, pctS = {}, sevS = {}, names = [];
        document.querySelectorAll('.perosak-item').forEach(row => {
            const n = row.querySelector('.perosak-name').value;
            if(n) { names.push(n); luasS[n] = parseFloat(row.querySelector('.perosak-luas').value)||0; pctS[n] = row.querySelector('.perosak-percent').value||0; sevS[n] = row.querySelector('.perosak-severity').value||1; }
        });

        // Convert images to Base64 JSON string
        const imgStr = await Promise.all(filesToUpload.map(file => new Promise((res) => {
            const r = new FileReader(); r.onload = () => res({name:file.name, dataUrl:r.result}); r.readAsDataURL(file);
        }))).then(JSON.stringify);

        const payload = {
            action: "submit",
            data: {
                namaPegawai: document.getElementById('namaPegawai').value,
                email: document.getElementById('email').value,
                tarikhBancian: document.getElementById('tarikhBancian').value,
                negeri: document.getElementById('negeriSelect').value,
                daerah: document.getElementById('daerahSelect').value,
                lokasi: document.getElementById('lokasi').value,
                koordinat: document.getElementById('gpsInput').value,
                kategori: document.getElementById('kategoriSelect').value,
                namaTanaman: document.getElementById('tanamanSelect').value,
                umurTanaman: document.getElementById('umurTanaman').value,
                varieti: document.getElementById('varieti').value,
                luasBertanam: document.getElementById('luasBertanamInput').value,
                senaraiPerosak: names.join(', '),
                syor: syors.join('; '),
                luasSerangan: luasS,
                peratusSerangan: pctS,
                keterukan: sevS, 
                images: imgStr,
                captionGambar: document.getElementById('captionInput').value || ""
            }
        };

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors", // Penting untuk hantar ke Apps Script tanpa CORS issue
            cache: "no-cache",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            document.getElementById('loader').style.visibility = 'hidden';
            alert('Laporan berjaya dihantar ke Google Sheets!');
            window.location.href = "../"; // Balik ke dashboard
        })
        .catch(err => {
            document.getElementById('loader').style.visibility = 'hidden';
            document.getElementById('btnSubmit').disabled = false;
            alert('Ralat teknikal: ' + err.message);
        });
    }
  </script>
</body>
</html>
